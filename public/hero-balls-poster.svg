<?xml version="1.0" encoding="UTF-8"?>
<!--
  Hero video poster. Matches the three overlay layers we paint on top of
  the actual video (ink darken + amber radial wash + edge vignette) so
  there's no visual "pop" when the video starts playing over the poster.

  Used as <video poster="..."> on the home page hero. Also satisfies
  Google Search Console's "No thumbnail URL provided" warning.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="amber" cx="50%" cy="0%" r="70%" fx="50%" fy="0%">
      <stop offset="0%" stop-color="#E9B84A" stop-opacity="0.22"/>
      <stop offset="65%" stop-color="#E9B84A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="50%" cy="50%" r="55%">
      <stop offset="40%" stop-color="#0E0F13" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0E0F13" stop-opacity="0.65"/>
    </radialGradient>
  </defs>
  <rect width="100%" height="100%" fill="#0E0F13"/>
  <rect width="100%" height="100%" fill="url(#amber)"/>
  <rect width="100%" height="100%" fill="url(#vignette)"/>
</svg>
