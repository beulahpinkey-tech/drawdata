name: Lottery daily refresh

# Single workflow, fires twice a day, refreshing every data source in one
# run:
#
#    1. fetch:pa         — PA Pick 3 / Pick 4 from palottery.pa.gov JSON
#    2. fetch:nj         — NJ Pick 3 / Pick 4 from njlottery.com JSON
#    3. fetch:wi         — WI Pick 3 / Pick 4 scraped from wilottery.com
#                          (merge-only writer — never overwrites shrunk)
#    4. fetch:tx         — TX Pick 3 / Daily 4 from texaslottery.com CSV
#                          exports (Day → Midday, Night → Evening; Morning
#                          + Evening intra-day draws are skipped)
#    5. fetch:nc         — NC Pick 3 / Pick 4 from nclottery.com download
#                          CSVs (D → Midday, E → Evening)
#    6. fetch:fl         — FL Pick 3 / Pick 4 from the floridalottery.com
#                          app API (2yr rolling window, merge-only)
#    7. fetch:wa         — WA Daily Game (3-digit only), walottery.com
#                          180-day rolling window, merge-only
#    8. fetch:ga         — GA Cash 3 / Cash 4 from galottery.com JSON
#                          (midday/evening/night streams)
#    9. fetch:mi         — MI Daily 3 / Daily 4, michiganlottery.com
#                          GraphQL, fetched in monthly chunks
#   10. fetch:ny         — NY Numbers / Win 4 from data.ny.gov Open Data
#                          (whole 1980→ history in a single request)
#   11. fetch:ca         — CA Daily 3 / Daily 4 from calottery.com API
#                          (~6-month rolling window; merge-only accumulator)
#   12. fetch:ma         — MA The Numbers Game (4-digit only) from
#                          masslottery.com. No range query exists, so past
#                          years are skipped via data/ma/fetched-years.json
#                          and only the current year's tail is refetched.
#   13. fetch:co         — CO Pick 3 (3-digit only) from the
#                          coloradolottery.com month archive, one page per
#                          month back to 2013-04; completed months cached
#   14. fetch:md         — MD Pick 3 / Pick 4 from mdlottery.com in a single
#                          request (~7-month rolling window, merge-only)
#   15. fetch:powerball  — Powerball from PA endpoint (g=12), merges
#                          with existing CSV to preserve 1992-2002 history
#   16. fetch:mm         — Mega Millions from data.ny.gov Open Data
#
# After fetching, npm run ingest regenerates JSON aggregates and runs
# freshness + size guards (freshness is FLAGGED, not fatal, so one dead
# upstream can't freeze the healthy datasets; >50 MB files warn). Then
# npm run verify gates the commit on structural correctness. If aggregates
# changed, the bot commits and pushes — Cloudflare Pages auto-rebuilds.
#
# Cron times (UTC, with 0-15 min jitter added in-job below):
#   19:17 UTC  — after midday draws (PA 1:35 PM ET, NJ 12:59 PM ET)
#   04:43 UTC  — after evening draws (PA 6:59 PM ET, NJ 10:57 PM ET)
#
# Manual override: workflow_dispatch lets you trigger from the Actions
# tab any time, skipping jitter so a human waiting for fresh data
# doesn't sit through a 15-min sleep.
#
# Filename is "pa-refresh.yml" for historical reasons — keeping it to
# preserve GitHub workflow run history. The display name above is
# what shows in the UI.

on:
  schedule:
    # Two fires per day to catch midday and evening draws. The MINUTE
    # values use a non-round number (17, 43) instead of 00 or 30 to
    # avoid the on-the-hour spike when half the world's cron jobs fire.
    # Combined with the 0-15min in-job jitter below, our actual hit
    # times spread across a ~30-min window — visibly organic to any
    # rate limiter looking at us.
    - cron: "17 19 * * *"  # midday window: after PA (1:35 PM ET) + NJ (12:59 PM ET) day draws
    - cron: "43 4 * * *"   # evening window: after PA (6:59 PM ET) + NJ (10:57 PM ET) evening draws
  workflow_dispatch:        # manual trigger from the Actions tab

# Least-privilege defaults. The job needs `contents: write` to push the
# refresh commit; everything else (actions/issues/packages/id-token/etc.)
# is explicitly denied so a hijacked action can't escalate to opening
# PRs, mutating issues, or minting OIDC tokens against cloud providers.
permissions:
  contents: write
  actions: none
  checks: none
  deployments: none
  issues: none
  packages: none
  pull-requests: none
  repository-projects: none
  security-events: none
  statuses: none
  id-token: none

concurrency:
  # Don't pile up runs if a refresh is mid-flight; cancel any older
  # queued run in favor of the newest one.
  group: pa-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # 30 min cap accommodates the worst case on a scheduled run:
    #   ~15 min jitter (0-899s random) + ~8-9 min total fetch across
    #   all 14 states + PB/MM + ~2 min ingest/verify + ~1 min push.
    #   Started at 10 min when we had 3 states; grew with TX (8 CSV
    #   pulls), NC (2 CSV pulls), and the 2026 batch (NY/CA/MA/CO/MD,
    #   measured at +82s cold). Public-repo Actions are unbilled so
    #   the upper bound here is cosmetic — a stuck run should fail,
    #   not loop forever, and 30 min gives plenty of headroom.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6  # runs on node24 (Node 20 actions deprecated)

      - name: Setup Node
        uses: actions/setup-node@v6  # runs on node24
        with:
          node-version: "22"  # current LTS
          cache: "npm"

      # Persist .cache/pa across runs. First run = full history fetch
      # (~200 API calls, ~1 min). Every subsequent run hits the cache
      # for old years and only fetches the current year (~4 calls, ~2s).
      - name: Restore PA year cache
        uses: actions/cache@v5
        with:
          path: .cache/pa
          key: pa-fetch-cache-${{ github.run_id }}
          restore-keys: |
            pa-fetch-cache-

      - name: Restore NJ year cache
        uses: actions/cache@v5
        with:
          path: .cache/nj
          key: nj-fetch-cache-${{ github.run_id }}
          restore-keys: |
            nj-fetch-cache-

      - name: Restore WI page cache
        uses: actions/cache@v5
        with:
          path: .cache/wi
          key: wi-fetch-cache-${{ github.run_id }}
          restore-keys: |
            wi-fetch-cache-

      - name: Restore TX CSV cache
        uses: actions/cache@v5
        with:
          path: .cache/tx
          key: tx-fetch-cache-${{ github.run_id }}
          restore-keys: |
            tx-fetch-cache-

      - name: Restore NC CSV cache
        uses: actions/cache@v5
        with:
          path: .cache/nc
          key: nc-fetch-cache-${{ github.run_id }}
          restore-keys: |
            nc-fetch-cache-

      - name: Restore FL year cache
        uses: actions/cache@v5
        with:
          path: .cache/fl
          key: fl-fetch-cache-${{ github.run_id }}
          restore-keys: |
            fl-fetch-cache-

      - name: Restore GA year cache
        uses: actions/cache@v5
        with:
          path: .cache/ga
          key: ga-fetch-cache-${{ github.run_id }}
          restore-keys: |
            ga-fetch-cache-

      - name: Restore MI month cache
        uses: actions/cache@v5
        with:
          path: .cache/mi
          key: mi-fetch-cache-${{ github.run_id }}
          restore-keys: |
            mi-fetch-cache-

      # MA is the one fetcher whose full backfill is expensive (~18,400
      # requests — its API has no range query, so one call per date). This
      # cache is a speed-up ONLY: the authoritative "which years are done"
      # record is data/ma/fetched-years.json, committed to the repo, so an
      # evicted cache costs nothing rather than triggering a re-backfill.
      - name: Restore MA year cache
        uses: actions/cache@v5
        with:
          path: .cache/ma
          key: ma-fetch-cache-${{ github.run_id }}
          restore-keys: |
            ma-fetch-cache-

      - name: Restore CO month cache
        uses: actions/cache@v5
        with:
          path: .cache/co
          key: co-fetch-cache-${{ github.run_id }}
          restore-keys: |
            co-fetch-cache-

      - name: Restore Powerball year cache
        uses: actions/cache@v5
        with:
          path: .cache/powerball
          key: powerball-fetch-cache-${{ github.run_id }}
          restore-keys: |
            powerball-fetch-cache-

      - name: Install deps
        run: npm ci --no-audit --no-fund

      # Random 0-15 minute jitter before any fetcher runs.
      # Two reasons:
      #  1. Polite-citizen pattern — without jitter, thousands of GH
      #     Actions workflows fire at the same minute and overload the
      #     same upstream APIs. Spreading us across a 15-min window is
      #     standard SaaS hygiene (Netflix's "split-brain prevention",
      #     Heroku's startup-time randomization, etc.).
      #  2. Avoids the cleanest possible bot fingerprint at the source
      #     ("requests at 19:30:00.000Z every day for 6 months"). Any
      #     reasonable rate limiter will pattern-match that. Jitter
      #     makes us look like a person glancing at the API at an
      #     organic time, not a sync'd bot.
      # Manual runs (workflow_dispatch) skip jitter so a human waiting
      # for fresh data doesn't sit through it.
      - name: Jitter (scheduled runs only)
        if: github.event_name == 'schedule'
        run: |
          DELAY=$((RANDOM % 900))
          echo "Sleeping ${DELAY}s (~$((DELAY / 60)) min) before fetching."
          echo "This spreads our load across the 19:30/04:30 cron window."
          sleep "$DELAY"

      # Every fetch step below is continue-on-error BY DESIGN.
      #
      # Upstreams break independently and often: a state lottery rate-limits
      # us (calottery.com returns 403 under load), puts a WAF in front of the
      # results page, or just 500s for an afternoon. Without this, one such
      # upstream fails its step, fails the job, and NOTHING gets committed —
      # so all 27 datasets go stale because one went down. That is the exact
      # failure mode precompute's staleness handling was written to avoid
      # ("shipping the healthy sources beats freezing everything").
      #
      # Every fetcher is merge-only and refuses to write an empty CSV, so a
      # failed fetch leaves last-known-good on disk untouched. The dataset
      # then ages, precompute flags it in meta.stale, and the failed step is
      # still visible in the Actions UI. Real corruption is caught separately
      # by the verify gate before the commit.

      - name: Fetch latest PA draws
        continue-on-error: true
        run: npm run fetch:pa

      - name: Fetch latest NJ draws
        continue-on-error: true
        run: npm run fetch:nj

      - name: Fetch latest WI draws (scrapes wilottery.com)
        continue-on-error: true
        run: npm run fetch:wi

      - name: Fetch latest TX draws (texaslottery.com CSV exports)
        continue-on-error: true
        run: npm run fetch:tx

      - name: Fetch latest NC draws (nclottery.com CSV exports)
        continue-on-error: true
        run: npm run fetch:nc

      - name: Fetch latest FL draws (floridalottery.com app API, 2yr rolling window, merge-only)
        continue-on-error: true
        run: npm run fetch:fl

      - name: Fetch latest WA draws (walottery.com Daily Game, 180-day rolling window, merge-only)
        continue-on-error: true
        run: npm run fetch:wa

      - name: Fetch latest GA draws (galottery.com API, Cash 3/4, midday/evening/night)
        continue-on-error: true
        run: npm run fetch:ga

      - name: Fetch latest MI draws (michiganlottery.com GraphQL, Daily 3/4, monthly chunks)
        continue-on-error: true
        run: npm run fetch:mi

      - name: Fetch latest NY draws (data.ny.gov Open Data, full history in one call)
        continue-on-error: true
        run: npm run fetch:ny

      - name: Fetch latest CA draws (calottery.com API, ~6mo rolling window, merge-only)
        continue-on-error: true
        run: npm run fetch:ca

      - name: Fetch latest MA draws (masslottery.com, incremental — past years skipped via manifest)
        continue-on-error: true
        run: npm run fetch:ma

      - name: Fetch latest CO draws (coloradolottery.com month archive, Pick 3 only)
        continue-on-error: true
        run: npm run fetch:co

      - name: Fetch latest MD draws (mdlottery.com, ~7mo rolling window, merge-only)
        continue-on-error: true
        run: npm run fetch:md

      - name: Fetch latest Powerball (PA Lottery JSON, g=12)
        continue-on-error: true
        run: npm run fetch:powerball

      - name: Fetch latest Mega Millions (NY Open Data)
        continue-on-error: true
        run: npm run fetch:mm

      - name: Regenerate JSON aggregates
        run: npm run ingest

      # Gate the commit on the data actually being coherent. These are
      # structural invariants (per-position totals, stream splits summing to
      # the combined count, shape/sum distributions, state-catalog agreement)
      # — NOT freshness, which precompute deliberately only flags so one dead
      # upstream can't freeze every healthy dataset. The digit-uniformity
      # test is reported as a warning for the same reason: it is statistical,
      # and must never wedge the refresh over sampling noise.
      #
      # If this fails, something is genuinely corrupt and we would rather
      # keep serving last-known-good than commit it.
      - name: Verify aggregates before committing
        run: npm run verify

      # Refuse to commit a dataset that LOST draws.
      #
      # This is the invariant the WI fetcher's merge-only writer was built
      # for after pagination silently truncated it and destroyed 14k rows.
      # But it was only ever enforced inside that one fetcher: NJ, TX and NC
      # still overwrite their CSV with whatever the upstream returned, so a
      # partial response silently deletes history. Observed in practice — a
      # single `npm run fetch:all` dropped 1,274 draws across those three
      # (NJ back to 2025-12-31) because their upstreams returned short.
      #
      # Draw history is append-only in reality: a CSV shrinking always means
      # a broken fetch, never a legitimate update. Catch it here, for every
      # state at once, rather than trusting each fetcher to police itself.
      - name: Refuse to commit shrunken datasets
        run: |
          set -uo pipefail
          fail=0
          for f in $(git ls-files 'data/*.csv' 'data/**/*.csv'); do
            old=$(git show "HEAD:$f" 2>/dev/null | grep -cE '^[0-9]{2}-' || echo 0)
            new=$(grep -cE '^[0-9]{2}-' "$f" || echo 0)
            if [ "$new" -lt "$old" ]; then
              echo "::error::$f lost draws: $old -> $new. Upstream returned a partial result and the fetcher overwrote instead of merging."
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            echo "Refusing to commit — restore with: git checkout HEAD -- data/"
            exit 1
          fi
          echo "OK — no dataset shrank."

      - name: Commit + push if anything changed
        run: |
          set -e
          git config user.name "drawdata-bot"
          git config user.email "drawdata-bot@users.noreply.github.com"
          # data/ma includes fetched-years.json — the manifest MUST be
          # committed or every run re-backfills Massachusetts from 1976.
          git add data/pa data/nj data/wi data/tx data/nc data/fl data/wa data/ga data/mi data/ny data/ca data/ma data/co data/md lib/data || true
          if git diff --cached --quiet; then
            echo "No new draws across any tracked state — nothing to commit."
            exit 0
          fi
          git commit -m "chore: refresh WI + PA + NJ + TX + NC + FL + WA + GA + MI + NY + CA + MA + CO + MD + MM + Powerball $(date -u +%Y-%m-%d_%H%MZ)"

          # Push with retry. The remote can move forward mid-run from a
          # manual trigger, an in-flight scheduled run, or you pushing
          # local changes — without this, the bot loses its fresh data
          # to a "fetch first" rejection and we wait for the next cron.
          # Rebasing onto remote is safe: our commit only touches
          # generated data files; other commits don't normally collide.
          for i in 1 2 3 4 5; do
            if git push; then
              echo "Pushed on attempt $i"
              # Tell IndexNow (Bing/Yandex/etc.) the refreshed pages changed,
              # so fresh draws get recrawled in minutes. Non-fatal.
              echo "Pinging IndexNow…"
              npm run indexnow || true
              exit 0
            fi
            echo "Push rejected on attempt $i — rebasing onto remote and retrying"
            sleep $((i * 2))
            if git pull --rebase origin main; then
              continue
            fi

            # Rebase conflict. The historical pain point is lib/data/meta.json:
            # the file is FULLY DERIVED from the per-state CSVs, but two
            # concurrent bot runs both write to it, so a rebase sees the
            # same lines changed in both branches and bails. This loop
            # cost us 3 days of stalled refreshes once. Self-heal:
            #   1. If the only conflicted file is meta.json (or aggregates,
            #      which are also generated), accept the remote version
            #      ("theirs" during rebase) — discards our generated
            #      blob — then re-run ingest to regenerate from the
            #      merged CSVs and continue the rebase.
            #   2. If anything OUTSIDE the generated files conflicts,
            #      that's a real human conflict and we still bail.
            CONFLICTS=$(git diff --name-only --diff-filter=U)
            echo "Rebase conflicts on:"
            echo "$CONFLICTS"
            REAL_CONFLICTS=$(echo "$CONFLICTS" | grep -vE '^lib/data/.*\.json$' || true)
            if [ -n "$REAL_CONFLICTS" ]; then
              echo "Non-generated files in conflict:"
              echo "$REAL_CONFLICTS"
              echo "Manual intervention needed."
              git rebase --abort || true
              exit 1
            fi

            echo "Only generated files in conflict — auto-resolving by accepting theirs + re-ingesting."
            # During rebase, "theirs" means the commit being rebased ONTO
            # (= remote main), so this takes the upstream's generated
            # JSON and discards ours. Then ingest regenerates from the
            # union of CSVs in the now-merged working tree.
            for f in $CONFLICTS; do
              git checkout --theirs -- "$f"
              git add "$f"
            done
            # Regenerate aggregates from the merged CSVs. This makes the
            # meta.json we ship reflect ALL the data on disk, not just
            # whichever side won the file checkout above.
            npm run ingest
            git add lib/data
            GIT_EDITOR=true git rebase --continue || {
              echo "rebase --continue failed even after auto-resolve; bailing"
              git rebase --abort || true
              exit 1
            }
          done
          echo "All 5 push attempts failed; bailing"
          exit 1
