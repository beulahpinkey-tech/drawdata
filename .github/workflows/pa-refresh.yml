name: Lottery daily refresh

# Fires twice a day, shortly after each Pennsylvania Pick 3 / Pick 4
# drawing, fetches that day's PA draws from the PA Lottery JSON endpoint
# AND a fresh Mega Millions full history from the NY Open Data feed,
# regenerates aggregates, and pushes if anything changed. Cloudflare
# Pages auto-rebuilds on the push.
#
# Times are UTC (GitHub Actions cron has no timezone). Conversions:
#   19:30 UTC = 1:30 PM CST (winter) / 2:30 PM CDT (summer)
#               — after both midday draws: PA 1:35 PM ET, NJ 12:59 PM ET
#   04:30 UTC = 10:30 PM CST (prev day, winter) / 11:30 PM CDT (summer)
#               — after all three evening draws: PA 6:59 PM ET, NJ 10:57 PM ET,
#                 and whatever WI was uploaded manually before midnight
#
# The evening cron used to fire at 02:30 UTC but that was 1 hour BEFORE
# NJ's 10:57 PM ET / 03:57 UTC evening draw — we'd ship yesterday's NJ
# data every cycle. Moved to 04:30 UTC to catch all three states.
#
# GitHub schedules drift up to ~15 minutes under load, so the buffers
# above are deliberate. Pre-draw fires return yesterday's data and waste
# a build.

on:
  schedule:
    - cron: "30 19 * * *"  # midday cron: after PA + NJ day draws
    - cron: "30 4 * * *"   # evening cron: after PA + NJ evening draws
  workflow_dispatch:        # manual trigger from the Actions tab

permissions:
  contents: write  # needed to push the refresh commit back to main

concurrency:
  # Don't pile up runs if a refresh is mid-flight; cancel any older
  # queued run in favor of the newest one.
  group: pa-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6  # runs on node24 (Node 20 actions deprecated)

      - name: Setup Node
        uses: actions/setup-node@v6  # runs on node24
        with:
          node-version: "22"  # current LTS
          cache: "npm"

      # Persist .cache/pa across runs. First run = full history fetch
      # (~200 API calls, ~1 min). Every subsequent run hits the cache
      # for old years and only fetches the current year (~4 calls, ~2s).
      - name: Restore PA year cache
        uses: actions/cache@v5
        with:
          path: .cache/pa
          key: pa-fetch-cache-${{ github.run_id }}
          restore-keys: |
            pa-fetch-cache-

      - name: Restore NJ year cache
        uses: actions/cache@v5
        with:
          path: .cache/nj
          key: nj-fetch-cache-${{ github.run_id }}
          restore-keys: |
            nj-fetch-cache-

      - name: Restore WI page cache
        uses: actions/cache@v5
        with:
          path: .cache/wi
          key: wi-fetch-cache-${{ github.run_id }}
          restore-keys: |
            wi-fetch-cache-

      - name: Restore Powerball year cache
        uses: actions/cache@v5
        with:
          path: .cache/powerball
          key: powerball-fetch-cache-${{ github.run_id }}
          restore-keys: |
            powerball-fetch-cache-

      - name: Install deps
        run: npm ci --no-audit --no-fund

      - name: Fetch latest PA draws
        run: npm run fetch:pa

      - name: Fetch latest NJ draws
        run: npm run fetch:nj

      - name: Fetch latest WI draws (scrapes wilottery.com)
        run: npm run fetch:wi

      - name: Fetch latest Powerball (PA Lottery JSON, g=12)
        run: npm run fetch:powerball

      - name: Fetch latest Mega Millions (NY Open Data)
        run: npm run fetch:mm

      - name: Regenerate JSON aggregates
        run: npm run ingest

      - name: Commit + push if anything changed
        run: |
          set -e
          git config user.name "drawdata-bot"
          git config user.email "drawdata-bot@users.noreply.github.com"
          git add data/pa data/nj data/wi lib/data || true
          if git diff --cached --quiet; then
            echo "No new WI / PA / NJ / MM / PB draws — nothing to commit."
            exit 0
          fi
          git commit -m "chore: refresh WI + PA + NJ + MM + Powerball $(date -u +%Y-%m-%d_%H%MZ)"

          # Push with retry. The remote can move forward mid-run from a
          # manual trigger, an in-flight scheduled run, or you pushing
          # local changes — without this, the bot loses its fresh data
          # to a "fetch first" rejection and we wait for the next cron.
          # Rebasing onto remote is safe: our commit only touches
          # generated data files; other commits don't normally collide.
          for i in 1 2 3 4 5; do
            if git push; then
              echo "Pushed on attempt $i"
              exit 0
            fi
            echo "Push rejected on attempt $i — rebasing onto remote and retrying"
            sleep $((i * 2))
            git pull --rebase origin main || {
              echo "Rebase failed — likely a real conflict on data files."
              echo "Manual intervention needed."
              exit 1
            }
          done
          echo "All 5 push attempts failed; bailing"
          exit 1
