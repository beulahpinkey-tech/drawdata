name: Lottery daily refresh

# Single workflow, fires twice a day, refreshes ALL SEVEN data sources
# in one run:
#
#   1. fetch:pa         — PA Pick 3 / Pick 4 from palottery.pa.gov JSON
#   2. fetch:nj         — NJ Pick 3 / Pick 4 from njlottery.com JSON
#   3. fetch:wi         — WI Pick 3 / Pick 4 scraped from wilottery.com
#                         (merge-only writer — never overwrites shrunk)
#   4. fetch:tx         — TX Pick 3 / Daily 4 from texaslottery.com CSV
#                         exports (Day → Midday, Night → Evening; Morning
#                         + Evening intra-day draws are skipped)
#   5. fetch:nc         — NC Pick 3 / Pick 4 from nclottery.com download
#                         CSVs (D → Midday, E → Evening)
#   6. fetch:powerball  — Powerball from PA endpoint (g=12), merges
#                         with existing CSV to preserve 1992-2002 history
#   7. fetch:mm         — Mega Millions from data.ny.gov Open Data
#
# After fetching, npm run ingest regenerates JSON aggregates and runs
# freshness + size guards (fail if any dataset is >7 days stale or any
# file >50 MB). If aggregates changed, the bot commits and pushes —
# Cloudflare Pages auto-rebuilds.
#
# Cron times (UTC, with 0-15 min jitter added in-job below):
#   19:17 UTC  — after midday draws (PA 1:35 PM ET, NJ 12:59 PM ET)
#   04:43 UTC  — after evening draws (PA 6:59 PM ET, NJ 10:57 PM ET)
#
# Manual override: workflow_dispatch lets you trigger from the Actions
# tab any time, skipping jitter so a human waiting for fresh data
# doesn't sit through a 15-min sleep.
#
# Filename is "pa-refresh.yml" for historical reasons — keeping it to
# preserve GitHub workflow run history. The display name above is
# what shows in the UI.

on:
  schedule:
    # Two fires per day to catch midday and evening draws. The MINUTE
    # values use a non-round number (17, 43) instead of 00 or 30 to
    # avoid the on-the-hour spike when half the world's cron jobs fire.
    # Combined with the 0-15min in-job jitter below, our actual hit
    # times spread across a ~30-min window — visibly organic to any
    # rate limiter looking at us.
    - cron: "17 19 * * *"  # midday window: after PA (1:35 PM ET) + NJ (12:59 PM ET) day draws
    - cron: "43 4 * * *"   # evening window: after PA (6:59 PM ET) + NJ (10:57 PM ET) evening draws
  workflow_dispatch:        # manual trigger from the Actions tab

# Least-privilege defaults. The job needs `contents: write` to push the
# refresh commit; everything else (actions/issues/packages/id-token/etc.)
# is explicitly denied so a hijacked action can't escalate to opening
# PRs, mutating issues, or minting OIDC tokens against cloud providers.
permissions:
  contents: write
  actions: none
  checks: none
  deployments: none
  issues: none
  packages: none
  pull-requests: none
  repository-projects: none
  security-events: none
  statuses: none
  id-token: none

concurrency:
  # Don't pile up runs if a refresh is mid-flight; cancel any older
  # queued run in favor of the newest one.
  group: pa-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # 30 min cap accommodates the worst case on a scheduled run:
    #   ~15 min jitter (0-899s random) + ~7 min total fetch across
    #   PA/NJ/WI/TX/NC/PB/MM + ~2 min ingest + ~1 min push. Started
    #   at 10 min when we had 3 states; grew with TX (8 CSV pulls)
    #   and NC (2 CSV pulls). Public-repo Actions are unbilled so
    #   the upper bound here is cosmetic — a stuck run should fail,
    #   not loop forever, and 30 min gives plenty of headroom.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6  # runs on node24 (Node 20 actions deprecated)

      - name: Setup Node
        uses: actions/setup-node@v6  # runs on node24
        with:
          node-version: "22"  # current LTS
          cache: "npm"

      # Persist .cache/pa across runs. First run = full history fetch
      # (~200 API calls, ~1 min). Every subsequent run hits the cache
      # for old years and only fetches the current year (~4 calls, ~2s).
      - name: Restore PA year cache
        uses: actions/cache@v5
        with:
          path: .cache/pa
          key: pa-fetch-cache-${{ github.run_id }}
          restore-keys: |
            pa-fetch-cache-

      - name: Restore NJ year cache
        uses: actions/cache@v5
        with:
          path: .cache/nj
          key: nj-fetch-cache-${{ github.run_id }}
          restore-keys: |
            nj-fetch-cache-

      - name: Restore WI page cache
        uses: actions/cache@v5
        with:
          path: .cache/wi
          key: wi-fetch-cache-${{ github.run_id }}
          restore-keys: |
            wi-fetch-cache-

      - name: Restore TX CSV cache
        uses: actions/cache@v5
        with:
          path: .cache/tx
          key: tx-fetch-cache-${{ github.run_id }}
          restore-keys: |
            tx-fetch-cache-

      - name: Restore NC CSV cache
        uses: actions/cache@v5
        with:
          path: .cache/nc
          key: nc-fetch-cache-${{ github.run_id }}
          restore-keys: |
            nc-fetch-cache-

      - name: Restore FL year cache
        uses: actions/cache@v5
        with:
          path: .cache/fl
          key: fl-fetch-cache-${{ github.run_id }}
          restore-keys: |
            fl-fetch-cache-

      - name: Restore GA year cache
        uses: actions/cache@v5
        with:
          path: .cache/ga
          key: ga-fetch-cache-${{ github.run_id }}
          restore-keys: |
            ga-fetch-cache-

      - name: Restore Powerball year cache
        uses: actions/cache@v5
        with:
          path: .cache/powerball
          key: powerball-fetch-cache-${{ github.run_id }}
          restore-keys: |
            powerball-fetch-cache-

      - name: Install deps
        run: npm ci --no-audit --no-fund

      # Random 0-15 minute jitter before any fetcher runs.
      # Two reasons:
      #  1. Polite-citizen pattern — without jitter, thousands of GH
      #     Actions workflows fire at the same minute and overload the
      #     same upstream APIs. Spreading us across a 15-min window is
      #     standard SaaS hygiene (Netflix's "split-brain prevention",
      #     Heroku's startup-time randomization, etc.).
      #  2. Avoids the cleanest possible bot fingerprint at the source
      #     ("requests at 19:30:00.000Z every day for 6 months"). Any
      #     reasonable rate limiter will pattern-match that. Jitter
      #     makes us look like a person glancing at the API at an
      #     organic time, not a sync'd bot.
      # Manual runs (workflow_dispatch) skip jitter so a human waiting
      # for fresh data doesn't sit through it.
      - name: Jitter (scheduled runs only)
        if: github.event_name == 'schedule'
        run: |
          DELAY=$((RANDOM % 900))
          echo "Sleeping ${DELAY}s (~$((DELAY / 60)) min) before fetching."
          echo "This spreads our load across the 19:30/04:30 cron window."
          sleep "$DELAY"

      - name: Fetch latest PA draws
        run: npm run fetch:pa

      - name: Fetch latest NJ draws
        run: npm run fetch:nj

      - name: Fetch latest WI draws (scrapes wilottery.com)
        run: npm run fetch:wi

      - name: Fetch latest TX draws (texaslottery.com CSV exports)
        run: npm run fetch:tx

      - name: Fetch latest NC draws (nclottery.com CSV exports)
        run: npm run fetch:nc

      - name: Fetch latest FL draws (floridalottery.com app API, 2yr rolling window, merge-only)
        run: npm run fetch:fl

      - name: Fetch latest WA draws (walottery.com Daily Game, 180-day rolling window, merge-only)
        run: npm run fetch:wa

      - name: Fetch latest GA draws (galottery.com API, Cash 3/4, midday/evening/night)
        run: npm run fetch:ga

      - name: Fetch latest Powerball (PA Lottery JSON, g=12)
        run: npm run fetch:powerball

      - name: Fetch latest Mega Millions (NY Open Data)
        run: npm run fetch:mm

      - name: Regenerate JSON aggregates
        run: npm run ingest

      - name: Commit + push if anything changed
        run: |
          set -e
          git config user.name "drawdata-bot"
          git config user.email "drawdata-bot@users.noreply.github.com"
          git add data/pa data/nj data/wi data/tx data/nc data/fl data/wa data/ga lib/data || true
          if git diff --cached --quiet; then
            echo "No new WI / PA / NJ / TX / NC / FL / WA / GA / MM / PB draws — nothing to commit."
            exit 0
          fi
          git commit -m "chore: refresh WI + PA + NJ + TX + NC + MM + Powerball $(date -u +%Y-%m-%d_%H%MZ)"

          # Push with retry. The remote can move forward mid-run from a
          # manual trigger, an in-flight scheduled run, or you pushing
          # local changes — without this, the bot loses its fresh data
          # to a "fetch first" rejection and we wait for the next cron.
          # Rebasing onto remote is safe: our commit only touches
          # generated data files; other commits don't normally collide.
          for i in 1 2 3 4 5; do
            if git push; then
              echo "Pushed on attempt $i"
              exit 0
            fi
            echo "Push rejected on attempt $i — rebasing onto remote and retrying"
            sleep $((i * 2))
            if git pull --rebase origin main; then
              continue
            fi

            # Rebase conflict. The historical pain point is lib/data/meta.json:
            # the file is FULLY DERIVED from the per-state CSVs, but two
            # concurrent bot runs both write to it, so a rebase sees the
            # same lines changed in both branches and bails. This loop
            # cost us 3 days of stalled refreshes once. Self-heal:
            #   1. If the only conflicted file is meta.json (or aggregates,
            #      which are also generated), accept the remote version
            #      ("theirs" during rebase) — discards our generated
            #      blob — then re-run ingest to regenerate from the
            #      merged CSVs and continue the rebase.
            #   2. If anything OUTSIDE the generated files conflicts,
            #      that's a real human conflict and we still bail.
            CONFLICTS=$(git diff --name-only --diff-filter=U)
            echo "Rebase conflicts on:"
            echo "$CONFLICTS"
            REAL_CONFLICTS=$(echo "$CONFLICTS" | grep -vE '^lib/data/.*\.json$' || true)
            if [ -n "$REAL_CONFLICTS" ]; then
              echo "Non-generated files in conflict:"
              echo "$REAL_CONFLICTS"
              echo "Manual intervention needed."
              git rebase --abort || true
              exit 1
            fi

            echo "Only generated files in conflict — auto-resolving by accepting theirs + re-ingesting."
            # During rebase, "theirs" means the commit being rebased ONTO
            # (= remote main), so this takes the upstream's generated
            # JSON and discards ours. Then ingest regenerates from the
            # union of CSVs in the now-merged working tree.
            for f in $CONFLICTS; do
              git checkout --theirs -- "$f"
              git add "$f"
            done
            # Regenerate aggregates from the merged CSVs. This makes the
            # meta.json we ship reflect ALL the data on disk, not just
            # whichever side won the file checkout above.
            npm run ingest
            git add lib/data
            GIT_EDITOR=true git rebase --continue || {
              echo "rebase --continue failed even after auto-resolve; bailing"
              git rebase --abort || true
              exit 1
            }
          done
          echo "All 5 push attempts failed; bailing"
          exit 1
