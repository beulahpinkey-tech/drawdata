# Deploy-health monitor.
#
# Why not scrape the live site: draw-data.com sits behind Cloudflare bot
# protection, which serves GitHub Actions' datacenter IPs a "Just a
# moment..." challenge instead of the page — so a curl from CI can't read
# the site no matter the User-Agent. Instead we ask Cloudflare directly:
# is the latest Pages deployment recent AND successful? That watches the
# exact thing that failed silently for ~20 days (builds breaking on
# ERESOLVE, so fresh commits never deployed).
#
# SETUP (until these are set, the job PASSES with a note — it never
# false-alarms): add three repository secrets —
#   CF_API_TOKEN   — a Cloudflare API token with "Account > Pages > Read"
#   CF_ACCOUNT_ID  — your Cloudflare account id
#   CF_PROJECT     — the Pages project name (e.g. "drawdata")
#
# Also recommended (belt-and-suspenders, zero code): enable Cloudflare's
# native notification — Dashboard > Notifications > "Pages build failed".

name: Live freshness check

on:
  schedule:
    - cron: "0 13 * * *" # once daily, after the morning data refresh
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check Cloudflare Pages deployment health
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_PROJECT: ${{ secrets.CF_PROJECT }}
          STALE_HOURS: "30" # refresh runs twice daily; >30h between deploys = stalled
        run: |
          set -uo pipefail

          if [ -z "${CF_API_TOKEN:-}" ] || [ -z "${CF_ACCOUNT_ID:-}" ] || [ -z "${CF_PROJECT:-}" ]; then
            echo "Cloudflare deploy monitoring not configured — skipping (this is a PASS, not a failure)."
            echo "To enable: add CF_API_TOKEN (Pages:Read), CF_ACCOUNT_ID, CF_PROJECT repo secrets."
            echo "Recommended regardless: Cloudflare Dashboard > Notifications > 'Pages build failed'."
            exit 0
          fi

          API="https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/pages/projects/${CF_PROJECT}/deployments?env=production&per_page=1"
          RESP=$(curl -sS --max-time 30 -H "Authorization: Bearer ${CF_API_TOKEN}" "$API" || true)

          OK=$(printf '%s' "$RESP" | jq -r '.success // false')
          if [ "$OK" != "true" ]; then
            echo "::error::Cloudflare API call failed. Check CF_API_TOKEN / CF_ACCOUNT_ID / CF_PROJECT."
            printf '%s' "$RESP" | head -c 400; echo
            exit 1
          fi

          STATUS=$(printf '%s' "$RESP" | jq -r '.result[0].latest_stage.status // "unknown"')
          CREATED=$(printf '%s' "$RESP" | jq -r '.result[0].created_on // ""')
          echo "Latest production deployment: status=${STATUS} created=${CREATED}"

          if [ "$STATUS" != "success" ]; then
            echo "::error::Latest Cloudflare Pages deployment is '${STATUS}', not 'success' — the live site is not receiving updates."
            exit 1
          fi

          THEN=$(date -u -d "$CREATED" +%s 2>/dev/null || echo 0)
          if [ "$THEN" = "0" ]; then
            echo "::error::Could not parse deployment timestamp: '$CREATED'"
            exit 1
          fi
          AGE_HOURS=$(( ( $(date -u +%s) - THEN ) / 3600 ))
          echo "Last successful deploy was ${AGE_HOURS}h ago."

          if [ "$AGE_HOURS" -gt "$STALE_HOURS" ]; then
            echo "::error::No successful deploy in ${AGE_HOURS}h (> ${STALE_HOURS}h). Deploys appear stalled — check Cloudflare Pages."
            exit 1
          fi
          echo "OK — deploys are healthy (last success ${AGE_HOURS}h ago)."
